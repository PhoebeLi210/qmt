<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>错误 - 股票分析系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            color: #333;
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        
        .error-icon {
            font-size: 6em;
            margin-bottom: 20px;
            color: #f44336;
        }
        
        h1 {
            color: #f44336;
            margin-bottom: 20px;
            font-size: 2.5em;
        }
        
        p {
            color: #555;
            margin-bottom: 30px;
            font-size: 1.2em;
        }
        
        .error-details {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin: 30px 0;
            text-align: left;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            border-left: 4px solid #f44336;
        }
        
        .back-link {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1em;
            transition: transform 0.2s;
        }
        
        .back-link:hover {
            transform: translateY(-2px);
        }
        
        .stock-code {
            font-weight: bold;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-icon">❌</div>
        <h1>出错了！</h1>
        <p>很抱歉，无法分析股票 <span class="stock-code">{{ stock_code }}</span>。</p>
        
        {% if error %}
        <div class="error-details">
            <strong>错误信息：</strong><br>
            {{ error }}
        </div>
        {% endif %}
        
        <a href="/" class="back-link">🔙 返回输入页面</a>
    </div>
</body>
</html>
