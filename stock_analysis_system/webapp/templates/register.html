{% extends 'base.html' %}
{% block title %}注册 - chaogu{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>注册账号</h1>
  <form method="post" class="auth-form">
    <label>用户名</label>
    <input type="text" name="username" required autofocus>
    <label>密码（至少6位）</label>
    <input type="password" name="password" minlength="6" required>
    <label>邀请码</label>
    <input type="text" name="invite_code" required placeholder="向管理员索取">
    <button type="submit" class="btn btn-primary">注册并登录</button>
  </form>
  <p class="auth-alt">已有账号？<a href="{{ url_for('login') }}">直接登录</a></p>
</div>
{% endblock %}
