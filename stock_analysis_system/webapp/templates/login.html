{% extends 'base.html' %}
{% block title %}登录 - chaogu{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>登录 chaogu</h1>
  <form method="post" class="auth-form">
    <label>用户名</label>
    <input type="text" name="username" required autofocus>
    <label>密码</label>
    <input type="password" name="password" required>
    <button type="submit" class="btn btn-primary">登录</button>
  </form>
  <p class="auth-alt">还没有账号？<a href="{{ url_for('register') }}">凭邀请码注册</a></p>
</div>
{% endblock %}
